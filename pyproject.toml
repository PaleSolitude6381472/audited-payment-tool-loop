[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audited-payment-tool-loop"
version = "0.1.0"
description = "A typed payment-risk service with an auditable model tool loop."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.40,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/fintech_automation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

